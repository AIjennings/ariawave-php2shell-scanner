; ==========================================================================
; AriaWave Defensive PHP.ini Drop-In Mitigation for PHP2Shell
; (CVE-2026-109618 & CVE-2026-109619 — CVSS v4.0 9.2 Critical)
; Deploy to: /etc/php.d/99-php2shell-mitigate.ini (or /etc/php/8.x/fpm/conf.d/)
; IMPORTANT: Partial mitigation only — upgrade PHP to 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35
; ==========================================================================

; 1. Enforce a conservative per-request memory ceiling well below physical RAM
;    to reduce heap/allocator exhaustion grooming vectors (CVE-2026-109619).
memory_limit = 128M

; 2. Bound untrusted input variable nesting and count.
max_input_vars = 1000
max_input_nesting_level = 64
max_input_time = 60
post_max_size = 16M

; 3. Disable dangerous process-execution functions if the application does not
;    strictly require shell subprocess invocation.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; 4. Prevent information disclosure of exact PHP patch levels in HTTP headers.
expose_php = Off
display_errors = Off
log_errors = On
